name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        run: |
          echo "=== installing moon ==="
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version

      - name: Update registry index
        run: moon update

      - name: Moon check
        run: |
          moon check --deny-warn 2>&1 | tee moon-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::moon check output"
            cat moon-check.log
            echo "::endgroup::"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < moon-check.log
            exit "$status"
          fi

      - name: Moon test
        run: moon test
