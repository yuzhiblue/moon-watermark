name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        run: |
          echo "=== installing moon ==="
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          echo "=== moon version ==="
          moon version

      - name: Update registry index
        run: |
          echo "=== moon update ==="
          moon update || moon update || moon update
          echo "=== update done ==="

      # 第一次 moon check：会下载依赖到 .mooncakes，但因旧格式包报错退出。
      # 包已写入磁盘，不会回滚。
      - name: moon check (first pass, downloads deps)
        run: |
          echo "=== first moon check (expect legacy format error) ==="
          moon check --deny-warn || true
          echo "=== first pass done, listing .mooncakes ==="
          find .mooncakes -name "moon*.json" -o -name "moon*.mod" -o -name "moon*.pkg" | head -20

      # 迁移旧格式包（此时 .mooncakes 已经有文件）
      - name: Migrate legacy package format
        run: |
          echo "=== migrating legacy package format ==="
          python3 scripts/migrate_legacy.py
          echo "=== migration done ==="

      # 第二次 moon check：应该能识别新格式包
      - name: moon check (retry after migration)
        run: |
          echo "=== retry moon check --deny-warn ==="
          moon check --deny-warn

      - name: moon test
        run: |
          echo "=== moon test ==="
          moon test
