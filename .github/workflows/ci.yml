name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        run: |
          echo "=== installing moon ==="
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          echo "=== moon version ==="
          moon version

      - name: Update registry index
        run: |
          echo "=== moon update ==="
          moon update || moon update || moon update
          echo "=== update done ==="

      - name: Download dependencies (legacy format, ignored)
        run: |
          echo "=== moon check (download deps, expect legacy format error) ==="
          moon check || true
          echo "=== deps downloaded ==="

      - name: Migrate legacy package format
        run: |
          echo "=== migrating legacy package format ==="
          python3 scripts/migrate_legacy.py
          echo "=== migration done ==="

      - name: moon check
        run: |
          echo "=== moon check --deny-warn ==="
          moon check --deny-warn

      - name: moon test
        run: |
          echo "=== moon test ==="
          moon test
