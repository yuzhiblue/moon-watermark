name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      # 全新 runner 无 registry index 缓存；moon update 初始化 index。
      - name: Update registry index
        run: |
          moon update || moon update || moon update

      # 先跑一次 moon check 让它把依赖下载到 .mooncakes；
      # 新版 moon（rr_moon_mod flag）不认注册表里旧格式包（moon.mod.json / moon.pkg.json），
      # 这一步会报错，但依赖包已经下载到本地缓存。
      - name: Download dependencies (will fail on legacy format, ignored)
        run: moon check || true

      # 把 .mooncakes 里旧格式的 moon.mod.json / moon.pkg.json
      # 迁移成新格式 moon.mod / moon.pkg（JSON -> TOML）。
      # 迁移后再正式 check 就能过。
      - name: Migrate legacy package format
        run: |
          python3 <<'PYEOF'
          import json, glob, os

          def json_to_toml(d):
              lines = []
              for k, v in d.items():
                  if isinstance(v, str):
                      lines.append(f'{k} = "{v}"')
                  elif isinstance(v, list):
                      items = ", ".join(f'"{x}"' if isinstance(x, str) else str(x) for x in v)
                      lines.append(f"{k} = [{items}]")
                  elif isinstance(v, bool):
                      lines.append(f"{k} = {'true' if v else 'false'}")
                  elif isinstance(v, (int, float)):
                      lines.append(f"{k} = {v}")
              return "\n".join(lines) + "\n"

          migrated = 0
          for path in glob.glob(".mooncakes/**/moon.mod.json", recursive=True):
              d = json.load(open(path))
              open(path.replace("moon.mod.json", "moon.mod"), "w").write(json_to_toml(d))
              os.remove(path)
              migrated += 1
          for path in glob.glob(".mooncakes/**/moon.pkg.json", recursive=True):
              d = json.load(open(path))
              open(path.replace("moon.pkg.json", "moon.pkg"), "w").write(json_to_toml(d))
              os.remove(path)
              migrated += 1
          print(f"migrated {migrated} legacy package files")
          PYEOF

      - name: moon check
        run: moon check --deny-warn

      - name: moon test
        run: moon test
