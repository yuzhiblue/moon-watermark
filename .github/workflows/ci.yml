name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        run: |
          echo "=== installing moon ==="
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          echo "=== moon version ==="
          moon version

      - name: Update registry index
        run: |
          echo "=== moon update ==="
          moon update || moon update || moon update

      # 第一次 moon check：下载依赖
      - name: moon check (first pass)
        run: |
          echo "=== first moon check ==="
          moon check --deny-warn || true

      # debug: 列出 .mooncakes 里所有文件
      - name: List .mooncakes before migration
        run: |
          echo "=== files in .mooncakes ==="
          find .mooncakes -type f | head -30
          echo "=== mizchi/json dir ==="
          ls -la .mooncakes/mizchi/json/ 2>/dev/null || echo "dir not found"

      # 手动迁移旧格式包
      - name: Migrate legacy package format
        run: |
          echo "=== running migration script ==="
          python3 scripts/migrate_legacy.py

      # debug: 列出迁移后的文件
      - name: List .mooncakes after migration
        run: |
          echo "=== files after migration ==="
          find .mooncakes -type f | head -30
          echo "=== mizchi/json dir after ==="
          ls -la .mooncakes/mizchi/json/ 2>/dev/null || echo "dir not found"

      # 第二次 moon check
      - name: moon check (retry)
        run: |
          echo "=== retry moon check --deny-warn ==="
          moon check --deny-warn

      - name: moon test
        run: |
          echo "=== moon test ==="
          moon test
