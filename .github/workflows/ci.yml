name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MoonBit toolchain
        env:
          # 固定工具链版本：latest 会破坏依赖 mizchi/image@0.4.3
          # （其 png_color.mbt 用了新版已移除的 ColorType::to_string）。
          MOONBIT_INSTALL_VERSION: "0.1.20261104"
        run: |
          echo "=== installing moon $MOONBIT_INSTALL_VERSION ==="
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.moon/bin:$PATH"
          moon version

      - name: Update registry index
        run: moon update

      - name: Moon check
        run: |
          moon check --deny-warn 2>&1 | tee moon-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::moon check output"
            cat moon-check.log
            echo "::endgroup::"
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error::$line"
            done < moon-check.log
            exit "$status"
          fi

      - name: Moon test
        run: moon test
